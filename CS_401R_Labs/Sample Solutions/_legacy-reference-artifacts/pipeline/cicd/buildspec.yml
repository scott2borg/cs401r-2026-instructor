## NorthStar Retail — CodeBuild Buildspec
## Runs in every CodePipeline execution (triggered by push to main).
##
## Phases:
##   install      — install Python dependencies
##   pre_build    — run data quality, feature, and model tests
##   build        — run fairness tests (warn only); run security scan; trigger SageMaker Pipeline
##   post_build   — publish build metrics to CloudWatch; upload test report to S3
##
## Environment variables set by CodePipeline / CodeBuild:
##   CODEBUILD_RESOLVED_SOURCE_VERSION   — Git commit SHA
##   NORTHSTAR_ROLE_ARN                  — SageMaker execution role ARN
##   NORTHSTAR_ARTIFACTS_BUCKET          — S3 bucket for artifacts and evaluation output
##   NORTHSTAR_METRICS_PATH              — Path to evaluation_metrics.json (set after pipeline)
##   NORTHSTAR_SLICE_METRICS_PATH        — Path to slice_metrics.json
##   AWS_DEFAULT_REGION                  — Injected by CodeBuild environment

version: 0.2

env:
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    # Default paths — overridden by post-training evaluate.py output location
    NORTHSTAR_METRICS_PATH: "./output/evaluation_metrics.json"
    NORTHSTAR_SLICE_METRICS_PATH: "./output/slice_metrics.json"
    NORTHSTAR_MODEL_PATH: "./model/model.xgb"
    NORTHSTAR_FEATURES_PATH: "./northstar-processed/features.parquet"
    NORTHSTAR_RAW_PATH: "./northstar-raw"
    NORTHSTAR_PROCESSED_PATH: "./northstar-processed"
    PIPELINE_NAME: "northstar-churn-pipeline"
  parameter-store:
    # Sensitive values fetched from SSM at build time (not stored in buildspec)
    NORTHSTAR_ROLE_ARN: "/northstar/cicd/sagemaker_role_arn"
    NORTHSTAR_ARTIFACTS_BUCKET: "/northstar/cicd/artifacts_bucket"

phases:

  install:
    runtime-versions:
      python: "3.11"
    commands:
      - echo "=== Installing dependencies ==="
      - pip install --quiet --upgrade pip
      - pip install --quiet -r requirements.txt
      - pip install --quiet -r requirements-dev.txt
      - echo "=== Dependency install complete ==="

  pre_build:
    on-failure: ABORT
    commands:
      - echo "=== [pre_build] Starting test suite ==="
      - COMMIT_SHA=${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}
      - echo "Commit SHA:$COMMIT_SHA"

      ## ---------------------------------------------------------------
      ## 1. Data quality tests
      ## ---------------------------------------------------------------
      - echo "--- Running data quality tests ---"
      - >
        pytest tests/test_data.py -v --tb=short
        --junitxml=reports/test_data_results.xml
        2>&1 | tee reports/test_data.log
      - echo "Data quality tests passed."

      ## ---------------------------------------------------------------
      ## 2. Feature unit tests
      ## ---------------------------------------------------------------
      - echo "--- Running feature unit tests ---"
      - >
        pytest tests/test_features.py -v --tb=short
        --junitxml=reports/test_features_results.xml
        2>&1 | tee reports/test_features.log
      - echo "Feature unit tests passed."

      ## ---------------------------------------------------------------
      ## 3. Model evaluation tests
      ##    (Skipped gracefully if model artifact not yet present)
      ## ---------------------------------------------------------------
      - echo "--- Running model evaluation tests ---"
      - >
        pytest tests/test_model.py -v --tb=short
        --junitxml=reports/test_model_results.xml
        2>&1 | tee reports/test_model.log
        || echo "Model tests skipped or failed — see reports/test_model.log"
      - echo "Model evaluation tests complete."

  build:
    on-failure: ABORT
    commands:
      - echo "=== [build] Running fairness tests and security scan ==="
      - COMMIT_SHA=${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}

      ## ---------------------------------------------------------------
      ## 4. Fairness tests (warn only — do NOT abort on warning)
      ##    We capture warnings and log them but do not propagate exit code.
      ##    A future iteration will POST the warning text to a JIRA webhook.
      ## ---------------------------------------------------------------
      - echo "--- Running fairness tests (warn-only mode) ---"
      - mkdir -p reports
      - |
        set +e
        pytest tests/test_fairness.py -v --tb=short \
          --junitxml=reports/test_fairness_results.xml \
          -W error::UserWarning \
          2>&1 | tee reports/test_fairness.log
        FAIRNESS_EXIT=$?
        set -e

        if grep -q "FAIRNESS ALERT" reports/test_fairness.log; then
          echo "WARNING: Fairness alert detected. Logging ticket request."
          ## TODO (Lab 5): POST to JIRA webhook or SNS topic
          ## curl -X POST "$JIRA_WEBHOOK_URL" -d @reports/test_fairness.log
          echo "Fairness warning logged — pipeline continues."
        fi

        if [ $FAIRNESS_EXIT -ne 0 ] && ! grep -q "FAIRNESS ALERT" reports/test_fairness.log; then
          echo "ERROR: Fairness test failed for a reason other than a threshold warning."
          exit $FAIRNESS_EXIT
        fi
      - echo "Fairness check complete."

      ## ---------------------------------------------------------------
      ## 5. Security scan (bandit)
      ##    Scans Python source for common security issues.
      ##    Severity HIGH findings abort the build; MEDIUM are logged only.
      ##    TODO (Lab 5): Add SAST integration with AWS CodeGuru Security.
      ## ---------------------------------------------------------------
      - echo "--- Running security scan (bandit) ---"
      - |
        bandit -r data/ models/ pipeline/ \
          --severity-level high \
          --confidence-level medium \
          -f json \
          -o reports/bandit_results.json \
          2>&1 | tee reports/bandit.log || true

        HIGH_COUNT=$(python3 -c "
        import json, sys
        try:
          d = json.load(open('reports/bandit_results.json'))
          highs = [r for r in d.get('results', []) if r.get('issue_severity') == 'HIGH']
          print(len(highs))
        except Exception as e:
          print(0)
        ")

        if [ "$HIGH_COUNT" -gt "0" ]; then
          echo "ERROR: bandit found $HIGH_COUNT HIGH-severity issue(s). Aborting build."
          cat reports/bandit_results.json
          exit 1
        fi
        echo "Security scan passed (0 HIGH-severity issues)."

      ## ---------------------------------------------------------------
      ## 6. Trigger SageMaker Pipeline
      ## ---------------------------------------------------------------
      - echo "--- Starting SageMaker Pipeline execution ---"
      - >
        python pipeline/sagemaker_pipeline.py
        --create
        --role "$NORTHSTAR_ROLE_ARN"
        --bucket "$NORTHSTAR_ARTIFACTS_BUCKET"
        --region "$AWS_DEFAULT_REGION"
      - >
        python pipeline/sagemaker_pipeline.py
        --run
        --role "$NORTHSTAR_ROLE_ARN"
        --bucket "$NORTHSTAR_ARTIFACTS_BUCKET"
        --region "$AWS_DEFAULT_REGION"
        --commit-sha "$COMMIT_SHA"
      - echo "SageMaker Pipeline execution started."

  post_build:
    commands:
      - echo "=== [post_build] Publishing metrics to CloudWatch ==="
      - COMMIT_SHA=${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}
      - BUILD_STATUS=$CODEBUILD_BUILD_SUCCEEDING

      ## ---------------------------------------------------------------
      ## 7. Publish build metrics to CloudWatch
      ##    Metrics namespace: NorthStar/CICD
      ## ---------------------------------------------------------------
      - |
        python3 - <<'METRICS_SCRIPT'
        import boto3, json, os, datetime

        cloudwatch = boto3.client("cloudwatch", region_name=os.environ.get("AWS_DEFAULT_REGION", "us-east-1"))
        commit_sha = os.environ.get("CODEBUILD_RESOLVED_SOURCE_VERSION", "local")[:8]
        build_id   = os.environ.get("CODEBUILD_BUILD_ID", "unknown")
        build_ok   = os.environ.get("CODEBUILD_BUILD_SUCCEEDING", "0") == "1"
        now        = datetime.datetime.utcnow()

        # Collect test counts from JUnit XML reports
        import xml.etree.ElementTree as ET, glob

        total_tests = failures = errors = 0
        for xml_path in glob.glob("reports/*_results.xml"):
            try:
                tree = ET.parse(xml_path)
                root = tree.getroot()
                suite = root if root.tag == "testsuite" else root.find("testsuite")
                if suite is not None:
                    total_tests += int(suite.get("tests", 0))
                    failures    += int(suite.get("failures", 0))
                    errors      += int(suite.get("errors", 0))
            except Exception:
                pass

        # Read AUC from metrics file if available
        auc_value = None
        metrics_path = os.environ.get("NORTHSTAR_METRICS_PATH", "./output/evaluation_metrics.json")
        try:
            with open(metrics_path) as f:
                m = json.load(f)
                auc_value = m.get("auc_roc")
        except Exception:
            pass

        metric_data = [
            {
                "MetricName": "BuildSuccess",
                "Value": 1.0 if build_ok else 0.0,
                "Unit": "Count",
                "Timestamp": now,
                "Dimensions": [{"Name": "Pipeline", "Value": "northstar-churn"}],
            },
            {
                "MetricName": "TestCount",
                "Value": float(total_tests),
                "Unit": "Count",
                "Timestamp": now,
                "Dimensions": [{"Name": "Pipeline", "Value": "northstar-churn"}],
            },
            {
                "MetricName": "TestFailures",
                "Value": float(failures + errors),
                "Unit": "Count",
                "Timestamp": now,
                "Dimensions": [{"Name": "Pipeline", "Value": "northstar-churn"}],
            },
        ]

        if auc_value is not None:
            metric_data.append({
                "MetricName": "AUCProxy",
                "Value": float(auc_value),
                "Unit": "None",
                "Timestamp": now,
                "Dimensions": [{"Name": "Pipeline", "Value": "northstar-churn"}],
            })

        try:
            cloudwatch.put_metric_data(
                Namespace="NorthStar/CICD",
                MetricData=metric_data,
            )
            print(f"Published {len(metric_data)} metrics to CloudWatch (Namespace: NorthStar/CICD)")
        except Exception as e:
            print(f"WARNING: Could not publish CloudWatch metrics: {e}")

        METRICS_SCRIPT

      ## ---------------------------------------------------------------
      ## 8. Upload test reports to S3
      ## ---------------------------------------------------------------
      - |
        if [ -n "$NORTHSTAR_ARTIFACTS_BUCKET" ]; then
          aws s3 cp reports/ \
            "s3://$NORTHSTAR_ARTIFACTS_BUCKET/cicd-reports/$COMMIT_SHA/" \
            --recursive --quiet \
            && echo "Test reports uploaded to s3://$NORTHSTAR_ARTIFACTS_BUCKET/cicd-reports/$COMMIT_SHA/"
        else
          echo "NORTHSTAR_ARTIFACTS_BUCKET not set — skipping report upload."
        fi

      - echo "=== Build complete: commit $COMMIT_SHA ==="

reports:
  northstar-test-report:
    files:
      - "reports/test_data_results.xml"
      - "reports/test_features_results.xml"
      - "reports/test_model_results.xml"
      - "reports/test_fairness_results.xml"
    file-format: "JUNITXML"

artifacts:
  files:
    - "reports/**/*"
    - "pipeline/sagemaker_pipeline.py"
  discard-paths: no

cache:
  paths:
    - "/root/.cache/pip/**/*"
