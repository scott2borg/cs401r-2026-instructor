# ─────────────────────────────────────────────────────────────────────────────
# Grading — assignment groups and weights
# ─────────────────────────────────────────────────────────────────────────────

grading:
  weighted: true
  # Weights must total 100; stage 1 refuses to build otherwise.
  # `notes` feeds the syllabus table, which is GENERATED from this block --
  # it used to be hardcoded HTML and drifted from the real weights.
  groups:
    - name: "Labs"
      weight: 49
      notes: "7 labs, equally weighted (~7% each)"
    - name: "Final Project"
      weight: 30
      notes: "Team-based; full system design + presentation"
    - name: "Reading Quizzes"
      weight: 10
      notes: "Weekly — opens Saturday, due Monday night"
    - name: "AWS Academy Courses"
      weight: 11
      notes: "Required AWS Academy prerequisite courses (Cloud Foundations, GenAI)"

# ─────────────────────────────────────────────────────────────────────────────
# Labs
# ─────────────────────────────────────────────────────────────────────────────

# Out-of-band prerequisites. Both gate a later lab and both depend on an AWS
# approval time that is not ours to control, which is why they are assigned in
# September rather than with the lab that needs them.
#
# 0 points is deliberate: each is graded inside the lab it gates (Pre-Lab 3
# within Lab 3 Task 4, Pre-Lab 4 within Lab 4 Task 2). The due date is the
# payload -- it puts them on the student calendar early enough for the
# approval to land.
# AWS Academy prerequisite courses. These carry the 11% "AWS Academy Courses"
# weight -- without them that group is empty, and Canvas silently drops an
# empty group's weight and scales the others up.
#
# Both open on the first day of class. They overlap Lab 1 deliberately: Lab 1
# is light, and these are self-paced coursework with a completion snapshot, not
# build work. Note the AWS Academy Learner Lab is used ONLY for these courses --
# the labs themselves run on the student's own Free Tier account.
academy:
  - title:    "AWS Academy — Cloud Foundations"
    assigned: "2026-09-03"
    due:      "2026-09-12"
    module:   "Week 01 — Introduction (Sep 3)"
    points:   50
    course:   "AWS Academy Cloud Foundations"
  - title:    "AWS Academy — Generative AI"
    assigned: "2026-09-03"
    due:      "2026-09-19"
    module:   "Week 01 — Introduction (Sep 3)"
    points:   50
    course:   "AWS Academy Introduction to Generative AI"

