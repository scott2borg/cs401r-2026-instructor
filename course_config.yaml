# ─────────────────────────────────────────────────────────────────────────────
# CS 401R Course Configuration
# Single source of truth for the build_course.py pipeline.
# Edit this file to update the course; re-run the pipeline to push changes.
# ─────────────────────────────────────────────────────────────────────────────

course:
  title:      "CS 401R: Engineering Production AI Systems"
  code:       "CS401R"
  semester:   "Fall 2026"
  instructor: "Scott Toborg"
  email:      "scott@toborg.com"
  credits:    3
  format:     "In-person lecture + AWS lab"
  start_date: "2026-09-03"          # first day of class
  end_date:   "2026-12-10"          # last day of class

canvas:
  base_url:  "https://byu.instructure.com"
  course_id: "34609"
  timezone:  "America/Denver"       # MDT/MST — used for due date calculations

# ─────────────────────────────────────────────────────────────────────────────
# Source book directory — change this to point at a different book/project
# ─────────────────────────────────────────────────────────────────────────────

source:
  directory:   "/Users/scott1/Documents/Vault/Efforts/Projects/Active/EAIE"
  bibliography: "Build/references.bib"
  output_dir:  "Build/canvas_chapters"   # relative to source.directory
  # PDF compression for chapter readings. Deliberately OFF.
  # The chapters carry architecture diagrams with small text labels, and
  # Ghostscript /ebook downsampled the worst figure on Ch01 to 12% of its
  # pixels (18.5 MB -> 1.1 MB). 16 chapters at full resolution is ~143 MB
  # against a 500 MB course quota, which fits.
  #   null       full resolution (current)
  #   "/printer" middle ground, ~18% of original size
  #   "/ebook"   smallest, softest figures
  compress_pdfs: null

# ─────────────────────────────────────────────────────────────────────────────
# Chapter definitions
# Each entry: file path (relative to source.directory), output PDF name,
# and the list of module names it should appear in.
# ─────────────────────────────────────────────────────────────────────────────

chapters:
  - file:    "Part 3. Build/AI Systems Development Lifecycle--The Framework for Building Production Systems.md"
    pdf:     "Ch01-AI-Systems-Development-Lifecycle.pdf"
    modules: ["Week 02 — AISDLC + Platform I (Sep 8–10)"]

  - file:    "Part 3. Build/AI Platform & Cloud Architecture--Building the Foundation for Scalable Systems.md"
